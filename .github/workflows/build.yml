name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: timeknit-vsix-${{ github.sha }}
          path: "*.vsix"
          if-no-files-found: error
